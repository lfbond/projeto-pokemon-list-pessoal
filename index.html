<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./src/img/favicon.ico" type="image/png" />

    <title>Lista de Pokemon - Proj. Pessoal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- styles -->
    <link rel="stylesheet" href="src/css/global.css" />
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="src/css/scrollbar.css" />
    <link rel="stylesheet" href="src/css/colorTipos.css" />
  </head>
  <body>
    <!-- header da index -->
    <header>
      <a href="index.html">
        <img src="src/img/pokeball.png" alt="pokeball" class="logo" />
      </a>
      <h1 class="title">Pokédex</h1>
      <button id="botao-altera-tema">
        <img src="src/img/sun.png" alt="Tema light" class="imagem-botao" />
      </button>
    </header>

    <!-- main da index -->
    <main>
      <div class="container">
        <!-- Campo de Busca -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar por nome ou número (ex: 25 ou Pikachu)" />
            <button id="searchButton">Buscar</button>
        </div>

        <!-- Onde a lista de Pokémon será renderizada -->
        <div id="pokedexContainer">
            <!-- A mensagem inicial "Carregando..." ou a lista de Pokémon aparecerá aqui -->
        </div>
    </div>

    <!-- JavaScripts -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    </main>
    <footer></footer>
    <script src="src/js/script.js"></script>
  </body>
</html>
